<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><rect width="1200" height="700" fill="#12141b"/><text x="1160" y="52" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#f0f2f8" direction="rtl">ذخیره یک عدد است، جریان یک هزینه</text><text x="1160" y="84" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">برای بالا بردن تولید ونزوئلا چقدر پول و چند سال لازم است؟ — برآورد Rystad Energy</text><rect x="60" y="130" width="300" height="200" rx="14" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="210" y="178" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">ذخیرهٔ موضوع قرارداد</text><text x="210" y="236" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="54" font-weight="700" fill="#fbbf24" direction="rtl">۶۳–۶۵</text><text x="210" y="268" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#f0f2f8" direction="rtl">میلیارد بشکه</text><text x="210" y="302" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">زیر زمین، همان‌جا که بود</text><rect x="60" y="350" width="300" height="200" rx="14" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="210" y="398" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">تولید واقعی امروز</text><text x="210" y="456" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="54" 