c','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">۲ تا ۳ سال</text><rect x="400" y="352" width="760" height="92" rx="12" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="1155" y="366" width="5" height="64" rx="2.5" fill="#7b8eff" opacity="1"/><text x="1138" y="386" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#f0f2f8" direction="rtl">عبور پایدار از ۱٫۴ میلیون بشکه</text><text x="1138" y="414" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#7b8eff" direction="rtl">۸ تا ۹ میلیارد دلار</text><text x="422" y="414" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">هر سال، از ۲۰۲۶</text><rect x="400" y="458" width="760" height="92" rx="12" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="1155" y="472" width="5" height="64" rx="2.5" fill="#fbbf24" opacity="1"/><text x="1138" y="492" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#f0f2f8" direction="rtl">رسیدن به ۳ میلیون بشکه</text><text x="1138" y="520" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#fbbf24" direction="rtl">۱۸۳ میلیارد دلار</text><text x="422" y="520" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">تا ۲۰۴۰</text><text x="1160" y="668" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">هیچ‌کدام از این پله‌ها امسال بشکهٔ تازه‌ای به بازار نمی‌رساند.</text><text x="60" y="668" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">داده: Rystad Energy · بلومبرگ</text></svg>