<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><rect width="1200" height="620" fill="#12141b"/><text x="1160" y="52" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#f0f2f8" direction="rtl">چه چیزی امروز قیمت نفت را تعیین می‌کند؟</text><text x="1160" y="84" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">عبور روزانهٔ تانکر از تنگهٔ هرمز، در برابر واکنش قیمت به بزرگ‌ترین تیتر نفتی سال</text><text x="1160" y="128" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#8891a8" direction="rtl">تنگهٔ هرمز — رهگیری MarineTraffic</text><rect x="620" y="140" width="540" height="54" rx="8" fill="#34d399" opacity="0.85"/><text x="1146" y="174" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#0b0d12" direction="rtl">~۱۳۰ عبور در روز</text><text x="1160" y="218" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">پیش از جنگ</text><rect x="1110.1538461538462" y="240" width="49.84615384615385" height="54" rx="8" fill="#f87171" opacity="0.85"/><text x="1146" y="274" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#0b0d12" direction="rtl">۸ تا ۱۵ عبور در روز</text><text x="1160" y="318" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">۴ تا ۶ آگوست ۲۰۲۶</text><text x="1160" y="366" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#5b6480" direction="rtl">یک‌پنجم نفت و LNG دنیا از این تنگه عبور می‌کرد.</text><rect x="60" y="106" width="520" height="300" rx="14" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="554" y="140" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f0f2f8" direction="rtl">واکنش برنت به قرارداد ونزوئلا</text><text x="554" y="168" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">۲۸ آگوست: «بزرگ‌ترین قرارداد نفتی تاریخ»</text><text x="320" y="258" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="#fbbf24">−۰٫۲۲٪</text><text x="320" y="292" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">تغییر ۲۴ ساعته، ۲۹ آگوست ۲۰۲۶</text><text x="320" y="342" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#f0f2f8" direction="rtl">۸۷٫۹۶ دلار</text><text x="320" y="370" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">پرپ برنت روی هایپرلیکوئید</text><text x="1160" y="588" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">بزرگ‌ترین تیتر ممکن، کوچک‌ترین واکنش ممکن — چون بازار جریان را قیمت می‌کند، نه ذخیره را.</text><text x="60" y="588" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">داده: API هایپرلیکوئید، ۲۹ آگوست ۲۰۲۶</text></svg>