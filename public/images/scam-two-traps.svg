<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><rect width="1200" height="520" fill="#12141b"/><text x="1160" y="52" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#f0f2f8" direction="rtl">دو تله، دو مکانیزم کاملاً متفاوت</text><text x="1160" y="84" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">یکی در کد قرارداد است و قبل از خرید قابل تشخیص؛ دیگری فقط رفتار آدم‌هاست</text><rect x="620" y="122" width="540" height="306" rx="14" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="1154" y="138" width="6" height="274" rx="3" fill="#f87171" opacity="1"/><text x="1134" y="164" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#f87171" direction="rtl">هانی‌پات</text><text x="1134" y="192" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">قرارداد نمی‌گذارد بفروشی</text><text x="1134" y="234" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">کجاست؟</text><text x="646" y="234" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">در کد قرارداد</text><text x="1134" y="280" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">قبل از خرید دیده می‌شود؟</text><text x="646" y="280" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">بله — با شبیه‌سازی فروش</text><text x="1134" y="326" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">ابزار</text><text x="646" y="326" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">honeypot.is / rugcheck</text><text x="1134" y="372" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">نشانه</text><text x="646" y="372" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">تکس فروش بالا یا فروش ناممکن</text><rect x="40" y="122" width="540" height="306" rx="14" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="574" y="138" width="6" height="274" rx="3" fill="#fbbf24" opacity="1"/><text x="554" y="164" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#fbbf24" direction="rtl">راگ‌پول</text><text x="554" y="192" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">نقدینگی کشیده می‌شود بیرون</text><text x="554" y="234" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">کجاست؟</text><text x="66" y="234" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">در کیف پول سازنده</text><text x="554" y="280" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">قبل از خرید دیده می‌شود؟</text><text x="66" y="280" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">فقط به‌صورت احتمال</text><text x="554" y="326" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">ابزار</text><text x="66" y="326" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">rugcheck / bubblemaps</text><text x="554" y="372" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">نشانه</text><text x="66" y="372" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">تمرکز عرضه و سابقهٔ سازنده</text><rect x="40" y="450" width="1120" height="62" rx="12" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="1134" y="488" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">راگ آرام: هیچ کد خرابی لازم نیست — سازنده و نزدیکانش طی چند هفته آرام‌آرام می‌فروشند. هیچ ابزاری این را از قبل نشان نمی‌دهد.</text><text x="60" y="496" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">گزارش تمیز یعنی این دو تله دیده نشد، نه اینکه توکن امن است.</text></svg>