<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><rect width="1200" height="640" fill="#12141b"/><text x="1160" y="52" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#f0f2f8" direction="rtl">سود از کجا می‌آید و چقدر بوده است؟</text><text x="1160" y="84" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">پوزیشن ۵٬۰۰۰ دلاری در هر سمت — جهت بازار حذف می‌شود، فقط حرکت نسبی می‌ماند</text><rect x="620" y="122" width="540" height="214" rx="14" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="1138" y="154" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f0f2f8" direction="rtl">اگر کل بازار ۱۰٪ بریزد</text><text x="1138" y="196" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#8891a8" direction="rtl">لانگ اتریوم</text><text x="642" y="196" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f87171" direction="rtl">−۵۰۰ دلار</text><text x="1138" y="240" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#8891a8" direction="rtl">شورت سولانا</text><text x="642" y="240" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#34d399" direction="rtl">+۵۰۰ دلار</text><line x1="642" y1="254" x2="1138" y2="254" stroke="#252836" stroke-width="1"/><text x="1138" y="284" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f0f2f8" direction="rtl">خالص</text><text x="642" y="284" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#7b8eff" direction="rtl">≈ ۰ دلار</text><rect x="620" y="354" width="540" height="150" rx="14" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="1138" y="386" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f0f2f8" direction="rtl">هزینهٔ نگه داشتن، ۳۰ روز اندازه‌گیری‌شده</text><text x="1138" y="422" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">فاندینگ خالص ETH/SOL</text><text x="642" y="422" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#34d399" direction="rtl">میانگین ۰٫۲٪ سالانه</text><text x="1138" y="458" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">کارمزد چهار معامله</text><text x="642" y="458" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fbbf24" direction="rtl">≈ ۱۵٪ سود متوسط</text><text x="1138" y="488" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#5b6480" direction="rtl">کارمزد کپی‌بیت، علاوه بر کارمزد پروتکل هایپرلیکوئید</text><rect x="40" y="122" width="540" height="382" rx="14" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="558" y="154" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f0f2f8" direction="rtl">شش ورود ETH/SOL در ۱۳ ماه گذشته</text><text x="558" y="180" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">قاعده: ورود در فاصلهٔ دو انحراف معیار، خروج در میانگین</text><line x1="310" y1="206" x2="310" y2="442" stroke="#252836" stroke-width="1.5"/><rect x="310" y="214" width="214" height="46" rx="7" fill="#34d399" opacity="0.85"/><text x="512" y="244" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#0b0d12" direction="rtl">+۱۰٫۷٪</text><text x="558" y="206" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">بهترین معامله</text><rect x="310" y="290" width="38.199999999999996" height="46" rx="7" fill="#7b8eff" opacity="0.85"/><text x="336.2" y="320" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#0b0d12" direction="rtl">+۱٫۹٪</text><text x="558" y="282" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">میانگین شش معامله</text><rect x="130" y="366" width="180" height="46" rx="7" fill="#f87171" opacity="0.85"/><text x="142" y="396" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#0b0d12" direction="rtl">−۹٫۰٪</text><text x="558" y="358" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">بدترین معامله</text><text x="558" y="478" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#fbbf24" direction="rtl">شش معامله برای نتیجه‌گیری آماری کافی نیست.</text><text x="1160" y="612" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">حذف ریسک جهت، حذف ریسک نیست — سود متوسط کوچک است و بدترین نتیجه پنج برابر آن.</text><text x="40" y="612" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">داده: کندل‌های روزانه و نرخ فاندینگ هایپرلیکوئید، ۳۱ آگوست ۲۰۲۶</text></svg>