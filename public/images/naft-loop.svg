<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><rect width="1200" height="430" fill="#12141b"/><text x="1160" y="54" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#f0f2f8" direction="rtl">زنجیره‌ای که معامله‌گر باید جدی بگیرد: نفت، تورم، فدرال رزرو</text><text x="1160" y="86" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">پرمیوم جنگی دیگر فقط داستان یک کالا نیست؛ به سیاست پولی رسیده است</text><rect x="910" y="190" width="250" height="120" rx="14" fill="#181b24" opacity="1" stroke="#fbbf24" stroke-width="2"/><text x="1035" y="240" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#fbbf24" direction="rtl">نفت گران</text><text x="1035" y="274" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#8891a8" direction="rtl">برنت حدود ۱۰۸ دلار، +۹٪ در هفته</text><line x1="910" y1="250" x2="878" y2="250" stroke="#5b6480" stroke-width="3" opacity="1"/><path d="M880,242 l-10,8 10,8 z" fill="#5b6480"/><rect x="620" y="190" width="250" height="120" rx="14" fill="#181b24" opacity="1" stroke="#f87171" stroke-width="2"/><text x="745" y="240" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#f87171" direction="rtl">تورم بالاتر</text><text x="745" y="274" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#8891a8" direction="rtl">CPI آمریکا +۰٫۴٪ ماهانه (بنزین)</text><line x1="620" y1="250" x2="588" y2="250" stroke="#5b6480" stroke-width="3" opacity="1"/><path d="M590,242 l-10,8 10,8 z" fill="#5b6480"/><rect x="330" y="190" width="250" height="120" rx="14" fill="#181b24" opacity="1" stroke="#7b8eff" stroke-width="2"/><text x="455" y="240" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#7b8eff" direction="rtl">فدرال رزرو</text><text x="455" y="274" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#8891a8" direction="rtl">افزایش نرخ حدود ۸۶٪، ۱۶ سپتامبر</text><line x1="330" y1="250" x2="298" y2="250" stroke="#5b6480" stroke-width="3" opacity="1"/><path d="M300,242 l-10,8 10,8 z" fill="#5b6480"/><rect x="40" y="190" width="250" height="120" rx="14" fill="#181b24" opacity="1" stroke="#8891a8" stroke-width="2"/><text x="165" y="240" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#8891a8" direction="rtl">فشار بر دارایی‌های پرریسک</text><text x="165" y="274" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#8891a8" direction="rtl">طلا ۳ هفتهٔ منفی</text><text x="1160" y="360" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#fbbf24" direction="rtl">نتیجه: نرخ بهرهٔ بالاتر برای مدت طولانی‌تر. تا وقتی نفت بالا بماند، فدرال رزرو فضای نرم شدن ندارد.</text><text x="80" y="410" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">منابع: BLS، CME FedWatch، CNBC · ۱۴ سپتامبر ۲۰۲۶</text></svg>