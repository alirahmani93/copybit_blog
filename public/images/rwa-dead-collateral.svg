<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><rect width="1200" height="540" fill="#12141b"/><text x="1160" y="56" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#f0f2f8" direction="rtl">وثیقهٔ مرده: بیشتر دارایی‌های دنیا بی‌کار پارک شده‌اند</text><text x="1160" y="88" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">از دارایی‌های قابل‌وثیقهٔ جهان، فقط بخش کوچکی واقعاً به‌عنوان وثیقه کار می‌کند — منبع: WEF، ۲۰۲۴</text><rect x="80" y="190" width="959" height="120" rx="10" fill="#2a2e3d" opacity="1"/><rect x="1039" y="190" width="121" height="120" rx="10" fill="#34d399" opacity="1"/><rect x="80" y="190" width="1080" height="120" rx="10" fill="none" opacity="1" stroke="#252836" stroke-width="1.5"/><text x="1160" y="174" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5b6480" direction="rtl">کل دارایی قابل‌وثیقه: ۲۵۵ تریلیون دلار</text><text x="1099.5" y="344" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#34d399" direction="rtl">۲۸٫۶ تریلیون</text><text x="1099.5" y="368" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#8891a8" direction="rtl">واقعاً وثیقه شده</text><line x1="1099.5" y1="310" x2="1099.5" y2="324" stroke="#34d399" stroke-width="1.5"/><text x="559.5" y="244" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#8891a8" direction="rtl">۲۲۶ تریلیون دلار</text><text x="559.5" y="276" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5b6480" direction="rtl">قفل در تسویهٔ کند و بدون سود</text><text x="1160" y="440" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#f0f2f8" direction="rtl">فقط حدود ۱۱٪ از این دارایی‌ها در گردش‌اند. توکنایز شدن همین بخشِ خوابیده را هدف گرفته است:</text><text x="1160" y="470" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#fbbf24" direction="rtl">وثیقه‌ای که هم‌زمان که ضمانت است، سود هم بسازد و در چند ثانیه جابه‌جا شود.</text><text x="80" y="518" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">داده: مجمع جهانی اقتصاد (World Economic Forum)، گزارش ۲۰۲۴</text></svg>