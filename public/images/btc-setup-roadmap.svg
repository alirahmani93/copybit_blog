to Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#f0f2f8" direction="rtl">مسیر ۱ (اصلی): شکست و تثبیت بالای ۸۴</text><line x1="390" y1="187" x2="416" y2="187" stroke="#fbbf24" stroke-width="3" opacity="1" stroke-dasharray="6 5"/><text x="380" y="192" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#f0f2f8" direction="rtl">مسیر ۲: رد شدن و اصلاح تا ۷۸ الی ۸۰</text><line x1="390" y1="215" x2="416" y2="215" stroke="#f87171" stroke-width="3" opacity="1" stroke-dasharray="6 5"/><text x="380" y="220" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#f0f2f8" direction="rtl">مسیر ۳: لغو رالی، بازگشت به ۷۵</text><text x="388" y="386.57142857142856" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f0f2f8" direction="rtl">اکنون: آستانهٔ ۸۴</text><rect x="640" y="640" width="520" height="52" rx="12" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="1146" y="672" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#f0f2f8" direction="rtl">از ورود ۸۱٫۲۵: ریسک ۳٫۲۵ هزار دلار، اهداف ۶٫۷۵ و ۱۰٫۷۵ هزار (۲R و ۳R)</text><rect x="100" y="640" width="520" height="52" rx="12" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="606" y="672" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#f0f2f8" direction="rtl">تا ۵ اکتبر · اهرم تا ۳ برابر · ریسک ۱ تا ۲٪ · در هدف نخست نیمی بسته شود</text><text x="40" y="706" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#5b6480" direction="rtl">مسیرها شماتیک‌اند، نه پیش‌بینی. این ستاپ آموزشی است؛ دو روز پیاپی خروج خالص از صندوق‌ها بر همهٔ سطوح مقدم است.</text></svg>