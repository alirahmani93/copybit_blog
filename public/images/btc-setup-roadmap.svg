<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#12141b"/><text x="1160" y="54" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#f0f2f8" direction="rtl">نقشهٔ راه و ستاپ معاملاتی بیت‌کوین (سوئینگ، حداکثر دو هفته)</text><text x="1160" y="86" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">سه مسیر محتمل روی سطوح ورود، حد ضرر و اهداف · قیمت به هزار دلار · ۲۱ سپتامبر ۲۰۲۶</text><line x1="100" y1="600" x2="760" y2="600" stroke="#252836" stroke-width="1" opacity="1"/><text x="1160" y="605" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">۷۲k</text><line x1="100" y1="532.8571428571429" x2="760" y2="532.8571428571429" stroke="#252836" stroke-width="1" opacity="1"/><text x="1160" y="537.8571428571429" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">۷۶k</text><line x1="100" y1="465.7142857142857" x2="760" y2="465.7142857142857" stroke="#252836" stroke-width="1" opacity="1"/><text x="1160" y="470.7142857142857" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">۸۰k</text><line x1="100" y1="398.57142857142856" x2="760" y2="398.57142857142856" stroke="#252836" stroke-width="1" opacity="1"/><text x="1160" y="403.57142857142856" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">۸۴k</text><line x1="100" y1="331.42857142857144" x2="760" y2="331.42857142857144" stroke="#252836" stroke-width