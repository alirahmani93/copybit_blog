<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><rect width="1000" height="470" fill="#12141b"/><text x="966" y="46" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#f0f2f8" direction="rtl">دامیننس بیت‌کوین به دو دلیل کاملاً متفاوت پایین می‌آید</text><text x="966" y="76" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">فقط یکی از این دو، چرخش نقدینگی است</text><rect x="516" y="108" width="450" height="296" rx="16" fill="#181b24" stroke="#34d399" stroke-width="1"/><rect x="516" y="108" width="450" height="4" rx="2" fill="#34d399"/><text x="741" y="152" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#34d399" direction="rtl">چرخش نقدینگی</text><text x="741" y="192" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#f0f2f8" direction="rtl">آلت‌ها تندتر بالا می‌روند</text><line x1="556" y1="216" x2="926" y2="216" stroke="#252836"/><text x="741" y="254" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#f0f2f8" direction="rtl">بیت‌کوین: ▲ ۹٪</text><text x="741" y="286" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#f0f2f8" direction="rtl">آلت‌ها: ▲ ۱۹٪</text><text x="741" y="334" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">پول تازه وارد بازار شده و سهم بیشتری از</text><text x="741" y="360" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">آن به آلت‌ها می‌رسد.</text><rect x="34" y="108" width="450" height="296" rx="16" fill="#181b24" stroke="#f87171" stroke-width="1"/><rect x="34" y="108" width="450" height="4" rx="2" fill="#f87171"/><text x="259" y="152" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f87171" direction="rtl">چرخش نیست</text><text x="259" y="192" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#f0f2f8" direction="rtl">بیت‌کوین تندتر پایین می‌رود</text><line x1="74" y1="216" x2="444" y2="216" stroke="#252836"/><text x="259" y="254" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#f0f2f8" direction="rtl">بیت‌کوین: ▼ ۱۵٪</text><text x="259" y="286" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#f0f2f8" direction="rtl">آلت‌ها: ▼ ۸٪</text><text x="259" y="334" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">کل بازار در حال ریزش است؛ دامیننس پایین</text><text x="259" y="360" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">آمده ولی هیچ پولی نچرخیده.</text><text x="966" y="444" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">در هر دو حالت BTC.D پایین می‌آید — عدد به‌تنهایی جهت پول را نشان نمی‌دهد.</text></svg>