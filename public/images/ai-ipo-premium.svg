<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><rect width="1200" height="560" fill="#12141b"/><text x="1160" y="56" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#f0f2f8" direction="rtl">بازار پرپ این دو شرکت را چقدر بالاتر از آخرین دور می‌بیند؟</text><text x="1160" y="88" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">ارزش‌گذاری آخرین دور خصوصی در برابر ارزش ضمنیِ قیمت پرپ — کوین‌گکو، حوالی ۱ سپتامبر ۲۰۲۶</text><rect x="467" y="150" width="393" height="54" rx="8" fill="#3a4380" opacity="1"/><text x="882" y="183" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">آنتروپیک · آخرین دور (مه ۲۰۲۶)</text><text x="483" y="183" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f0f2f8" direction="rtl">۹۶۵ میلیارد دلار</text><rect x="70" y="218" width="790" height="54" rx="8" fill="#7b8eff" opacity="1"/><text x="882" y="251" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">آنتروپیک · قیمت بازار پرپ</text><text x="86" y="251" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#12141b" direction="rtl">~۱٫۹۴ تریلیون دلار</text><text x="56" y="251" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fbbf24" direction="rtl">~۱۰۰٪ بالاتر</text><rect x="513" y="320" width="347" height="54" rx="8" fill="#1e5f48" opacity="1"/><text x="882" y="353" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">اوپن‌ای‌آی · آخرین دور (مارس ۲۰۲۶)</text><text x="529" y="353" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f0f2f8" direction="rtl">۸۵۲ میلیارد دلار</text><rect x="359" y="388" width="501" height="54" rx="8" fill="#34d399" opacity="1"/><text x="882" y="421" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">اوپن‌ای‌آی · قیمت بازار پرپ</text><text x="375" y="421" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#12141b" direction="rtl">~۱٫۲۳ تریلیون دلار</text><text x="345" y="421" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fbbf24" direction="rtl">~۴۲٪ بالاتر</text><text x="1160" y="476" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#fbbf24" direction="rtl">قیمت پرپ = حدسِ جمعیِ بازار با پول واقعی دربارهٔ ارزش روز عرضه؛ نه ارزش‌گذاری رسمی شرکت.</text><text x="80" y="538" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">داده: کوین‌گکو (میانگین چند پلتفرم)، حوالی ۱ سپتامبر ۲۰۲۶ — این اعداد روزانه تغییر می‌کنند.</text></svg>