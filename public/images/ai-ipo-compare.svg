<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><rect width="1200" height="560" fill="#12141b"/><text x="1160" y="56" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#f0f2f8" direction="rtl">دو غول، کنار هم: آنتروپیک و اوپن‌ای‌آی پیش از بورس</text><text x="1160" y="88" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">وضعیت هر دو شرکت پیش از عرضهٔ اولیه — تا سپتامبر ۲۰۲۶</text><rect x="615" y="128" width="545" height="372" rx="16" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="615" y="128" width="545" height="4" rx="0" fill="#7b8eff" opacity="1"/><text x="1132" y="174" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="23" font-weight="700" fill="#7b8eff" direction="rtl">آنتروپیک</text><text x="1132" y="218" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">محصول</text><text x="1132" y="242" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#f0f2f8" direction="rtl">کلاد و کلاد کد</text><text x="1132" y="274" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">آخرین دور خصوصی</text><text x="1132" y="298" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#f0f2f8" direction="rtl">۶۵ میلیارد جذب · ارزش ۹۶۵ میلیارد (مه ۲۰۲۶)</text><text x="1132" y="330" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" dire