ght="400" fill="#5b6480" direction="rtl">آخرین دور خصوصی</text><text x="557" y="298" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#f0f2f8" direction="rtl">۱۲۲ میلیارد جذب · ارزش ۸۵۲ میلیارد (مارس ۲۰۲۶)</text><text x="557" y="330" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">درآمد سالانه (تخمینی)</text><text x="557" y="354" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#f0f2f8" direction="rtl">~۴۰ میلیارد دلار (اوت ۲۰۲۶)</text><text x="557" y="386" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">درخواست عرضه</text><text x="557" y="410" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#f0f2f8" direction="rtl">محرمانه، ۸ ژوئن ۲۰۲۶</text><text x="557" y="442" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">انتظار بازار برای عرضه</text><text x="557" y="466" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#f0f2f8" direction="rtl">حوالی ۱ تریلیون · تاریخ قطعی ندارد</text><text x="1160" y="538" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">* عدد ۲ تریلیون انتظارِ سرمایه‌گذاران است (به گزارش فایننشال تایمز)، نه هدفِ اعلام‌شدهٔ شرکت.</text></svg>