<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#12141b"/><text x="1160" y="52" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#f0f2f8" direction="rtl">چک‌های مکانیکی روی این نمونه چیزی را فیلتر نکردند</text><text x="1160" y="84" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">۴۵ توکن سولانا که در ۳۱ آگوست ۲۰۲۶ برای تبلیغ پول داده بودند — اندازه‌گیری با API عمومی</text><text x="1160" y="116" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5b6480" direction="rtl">چند تا از ۴۵ توکن این پرچم را داشتند؟</text><text x="1160" y="158" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5b6480" direction="rtl">اختیار ضرب (Mint) هنوز باز است</text><rect x="60" y="132" width="630" height="40" rx="8" fill="#181b24" opacity="1"/><text x="676" y="158" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#5b6480" direction="rtl">هیچ‌کدام</text><text x="1160" y="218" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5b6480" direction="rtl">اختیار انجماد (Freeze) هنوز باز است</text><rect x="60" y="192" width="630" height="40" rx="8" fill="#181b24" opacity="1"/><text x="676" y="218" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#5b6480" direction="rtl">هیچ‌کدام</text><text x="1160" y="278" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">سازنده سابقهٔ راگ‌پول دارد</text><rect x="60" y="252" width="630" height="40" rx="8" fill="#181b24" opacity="1"/><rect x="592" y="252" width="98" height="40" rx="8" fill="#f87171" opacity="0.9"/><text x="578" y="278" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">۷ از ۴۵  (۱۶٪)</text><text x="1160" y="338" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">نقدینگی کمتر از ۱۰۰٪ قفل است</text><rect x="60" y="312" width="630" height="40" rx="8" fill="#181b24" opacity="1"/><rect x="550" y="312" width="140" height="40" rx="8" fill="#34d399" opacity="0.9"/><text x="536" y="338" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">۱۰ از ۴۵  (۲۲٪)</text><text x="1160" y="398" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">اصلاً جفت معاملاتی ندارد</text><rect x="60" y="372" width="630" height="40" rx="8" fill="#181b24" opacity="1"/><rect x="536" y="372" width="154" height="40" rx="8" fill="#f87171" opacity="0.9"/><text x="522" y="398" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">۱۱ از ۴۵  (۲۴٪)</text><text x="1160" y="458" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">نقدینگی زیر ۱۰٬۰۰۰ دلار</text><rect x="60" y="432" width="630" height="40" rx="8" fill="#181b24" opacity="1"/><rect x="424" y="432" width="266" height="40" rx="8" fill="#f87171" opacity="0.9"/><text x="410" y="458" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">۱۹ از ۴۵  (۴۲٪)</text><text x="1160" y="518" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">شبکهٔ کیف‌پول‌های مرتبط شناسایی شد</text><rect x="60" y="492" width="630" height="40" rx="8" fill="#181b24" opacity="1"/><rect x="410" y="492" width="280" height="40" rx="8" fill="#f87171" opacity="0.9"/><text x="396" y="518" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">۲۰ از ۴۵  (۴۴٪)</text><text x="1160" y="578" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#f0f2f8" direction="rtl">ده هولدر اول بیش از ۳۰٪ عرضه</text><rect x="60" y="552" width="630" height="40" rx="8" fill="#181b24" opacity="1"/><rect x="144" y="552" width="546" height="40" rx="8" fill="#f87171" opacity="0.9"/><text x="130" y="578" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">۳۹ از ۴۵  (۸۷٪)</text><text x="1160" y="640" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#8891a8" direction="rtl">سه پرچم اول همان‌هایی‌اند که هر چک‌لیستی اول از همه می‌گوید نگاه کن.</text><text x="1160" y="668" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#fbbf24" direction="rtl">روی این نمونه هر سه برای صددرصد توکن‌ها سبز بودند — چون لانچ‌پد خودکار انجامشان می‌دهد.</text><text x="60" y="694" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">داده: DexScreener · rugcheck.xyz · GoPlus — ۳۱ آگوست ۲۰۲۶</text></svg>