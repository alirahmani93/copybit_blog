<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><rect width="1200" height="520" fill="#12141b"/><text x="1160" y="58" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#f0f2f8" direction="rtl">هفتهٔ سرنوشت‌ساز سپتامبر ۲۰۲۶: دو جلسه پشت سر هم</text><text x="1160" y="90" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">آنچه بازار پیش از جلسه‌ها قیمت‌گذاری کرده — عکس لحظه‌ای، نه پیش‌بینی</text><rect x="615" y="130" width="545" height="300" rx="16" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="1132" y="174" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#7b8eff" direction="rtl">فدرال رزرو آمریکا</text><text x="1132" y="204" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">۱۵–۱۶ سپتامبر · تصمیم روز ۱۶</text><rect x="643" y="238" width="489" height="46" rx="9" fill="#3a4056" opacity="1"/><rect x="878" y="238" width="254" height="46" rx="9" fill="#7b8eff" opacity="1"/><text x="1005" y="267" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#12141b" direction="rtl">افزایش ۲۵ واحد: ۵۲٪</text><text x="760.5" y="267" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#f0f2f8" direction="rtl">بدون تغییر: ۴۸٪</text><text x="1132" y="338" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">بازار پیش‌بینی (پالی‌مارکت): حجم ~۹۳ میلیون دلار</text><text x="1132" y="366" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#fbbf24" direction="rtl">ولی بازار آتی SOFR فقط ~۳۲٪ می‌گوید — یعنی بازار دودل است</text><text x="1132" y="402" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">مهم‌تر از خودِ تصمیم: لحن کنفرانس خبری</text><rect x="40" y="130" width="545" height="300" rx="16" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="557" y="174" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#34d399" direction="rtl">بانک مرکزی ژاپن</text><text x="557" y="204" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">۱۷–۱۸ سپتامبر</text><rect x="68" y="238" width="489" height="46" rx="9" fill="#3a4056" opacity="1"/><rect x="166" y="238" width="391" height="46" rx="9" fill="#34d399" opacity="1"/><text x="361.5" y="267" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#12141b" direction="rtl">افزایش نرخ: ~۸۰٪</text><text x="557" y="338" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">حرکت مورد انتظار: به سمت ۱٫۲۵٪</text><text x="557" y="366" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#f0f2f8" direction="rtl">چیزی که مهم است، لحنِ بعد از تصمیم است:</text><text x="557" y="394" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#34d399" direction="rtl">هر سیگنالِ ادامهٔ مسیر = ادامهٔ بازگشت پول ژاپنی</text><text x="80" y="500" text-anchor="end" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#5b6480" direction="rtl">داده: تقویم فدرال رزرو و بانک مرکزی ژاپن؛ پالی‌مارکت — ۴ سپتامبر ۲۰۲۶. این اعداد روزانه تغییر می‌کنند.</text></svg>