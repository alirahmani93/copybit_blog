<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img"><rect width="1200" height="440" fill="#12141b"/><text x="1160" y="54" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#f0f2f8" direction="rtl">بازار تا کجا را باور کرده است؟</text><text x="1160" y="86" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">احتمال قیمت‌گذاری‌شده برای رسیدن بیت‌کوین به هر سطح، در بازارهای مشتقه و پیش‌بینی (۲۱ سپتامبر ۲۰۲۶)</text><rect x="160" y="140" width="820" height="46" rx="8" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="324" y="140" width="656" height="46" rx="8" fill="#34d399" opacity="0.9"/><text x="1160" y="170" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#f0f2f8" direction="rtl">۸۵ هزار دلار</text><text x="310" y="170" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#34d399" direction="rtl">حدود ۸۰ درصد</text><rect x="160" y="218" width="820" height="46" rx="8" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="496.20000000000005" y="218" width="483.79999999999995" height="46" rx="8" fill="#fbbf24" opacity="0.9"/><text x="1160" y="248" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#f0f2f8" direction="rtl">۹۰ هزار دلار</text><text x="482.20000000000005" y="248" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fbbf24" direction="rtl">حدود ۵۹ درصد</text><rect x="160" y="296" width="820" height="46" rx="8" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="775" y="296" width="205" height="46" rx="8" fill="#f87171" opacity="0.9"/><text x="1160" y="326" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#f0f2f8" direction="rtl">۱۰۰ هزار دلار</text><text x="761" y="326" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f87171" direction="rtl">حدود ۲۵ درصد</text><text x="1160" y="398" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#fbbf24" direction="rtl">بازار به عبور از ۸۴ هزار باور دارد، اما هنوز به یک رالی کامل ایمان نیاورده است.</text></svg>