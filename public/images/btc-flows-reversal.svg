<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><rect width="1200" height="600" fill="#12141b"/><text x="1160" y="54" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#f0f2f8" direction="rtl">فروش پیش از خبر انجام شد، خرید پس از آن</text><text x="1160" y="86" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">جریان خالص صندوق‌های قابل معاملهٔ بیت‌کوین و قیمت، پیش و پس از افزایش نرخ بهره در ۱۶ سپتامبر ۲۰۲۶</text><text x="980" y="134" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f87171" direction="rtl">پیش از جلسه (دو روز)</text><text x="640" y="134" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fbbf24" direction="rtl">چهارشنبه ۱۶ سپتامبر</text><text x="300" y="134" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#34d399" direction="rtl">جمعه ۱۸ سپتامبر</text><line x1="810" y1="116" x2="810" y2="520" stroke="#252836" stroke-width="1.5" opacity="1" stroke-dasharray="4 6"/><line x1="470" y1="116" x2="470" y2="520" stroke="#252836" stroke-width="1.5" opacity="1" stroke-dasharray="4 6"/><polyline points="980,250 640,232 300,196 120,173.5" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/><circle cx="980" cy="250" r="5" fill="#fbbf24"/><circle cx="640" cy="232" r="5" fill="#fbbf24"/><circle cx="300" cy="196" r="5" fill="#fbbf24"/><circle cx="120" cy="173.5" r="5" fill="#fbbf24"/><text x="980" y="278" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#8891a8" direction="rtl">قیمت تا حدود ۷۵ هزار دلار</text><text x="300" y="180" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#8891a8" direction="rtl">بازگشت به بالای ۸۱ هزار</text><text x="120" y="157.5" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" direction="rtl">آستانهٔ ۸۴ هزار</text><text x="640" y="196" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#f0f2f8" direction="rtl">افزایش ۰٫۲۵ واحدی، نرخ ۳٫۷۵ تا ۴ درصد</text><text x="640" y="286" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#8891a8" direction="rtl">نخستین افزایش از سال ۲۰۲۳</text><line x1="60" y1="410" x2="1140" y2="410" stroke="#3a4056" stroke-width="1.5" opacity="1"/><rect x="920" y="410" width="120" height="96.98" rx="6" fill="#f87171" opacity="0.9"/><text x="980" y="530.98" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f87171" direction="rtl">خروج ۷۴۶ میلیون دلار</text><rect x="240" y="353.71" width="120" height="56.29" rx="6" fill="#34d399" opacity="0.35"/><rect x="240" y="369.57" width="120" height="40.43" rx="6" fill="#34d399" opacity="1"/><text x="300" y="434" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#34d399" direction="rtl">ورودی خالص ۴۳۳ میلیون دلار</text><text x="300" y="456" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#8891a8" direction="rtl">از این رقم، ۳۱۱ میلیون دلار فقط فیدلیتی</text><text x="640" y="434" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#f0f2f8" direction="rtl">فروشندهٔ تازه‌ای باقی نمانده بود</text><text x="640" y="396" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">خبر از قبل قیمت خورده بود</text><rect x="60" y="530" width="470" height="40" rx="10" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><text x="516" y="556" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#f0f2f8" direction="rtl">هم‌زمان بیش از ۲۴۳ میلیون دلار پوزیشن شورت لیکوئید شد</text><text x="1140" y="556" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#5b6480" direction="rtl">ارقام طبق تحلیل ۲۱ سپتامبر ۲۰۲۶ · مقیاس قیمت شماتیک است</text></svg>