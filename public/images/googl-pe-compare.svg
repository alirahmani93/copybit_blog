<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><rect width="1200" height="420" fill="#12141b"/><text x="1160" y="54" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#f0f2f8" direction="rtl">گوگل نسبت به سود خود ارزان‌تر از همتایان و از گذشتهٔ خودش معامله می‌شود</text><text x="1160" y="86" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">نسبت قیمت به سود (P/E)، ۵ اکتبر ۲۰۲۶</text><rect x="578.9000000000001" y="124" width="321.09999999999997" height="36" rx="7" fill="#34d399" opacity="0.9"/><text x="1160" y="148" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">گوگل، اکنون</text><text x="566.9000000000001" y="148" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#34d399" direction="rtl">۱۶٫۹</text><rect x="425" y="176" width="475" height="36" rx="7" fill="#8891a8" opacity="0.9"/><text x="1160" y="200" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">گوگل، میانگین پنج سال</text><text x="413" y="200" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#8891a8" direction="rtl">۲۵</text><rect x="352.80000000000007" y="228" width="547.1999999999999" height="36" rx="7" fill="#8891a8" opacity="0.9"/><text x="1160" y="252" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f0f2f8" direction="rtl">گوگل، پایان ۲۰۲۵</text><text x="340.80000000000007" y="252" text-anchor="start" font-family="Va