<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img"><rect width="1000" height="500" fill="#12141b"/><text x="966" y="46" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#f0f2f8" direction="rtl">یک ادعای قابل بررسی سه جزء دارد</text><text x="966" y="76" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">اگر هر سه نبود، آن متن تحلیل نیست</text><rect x="34" y="110" width="290" height="216" rx="16" fill="#181b24" stroke="#252836" stroke-width="1"/><circle cx="179" cy="156" r="21" fill="none" stroke="#f87171" stroke-width="2"/><text x="179" y="163" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f87171" direction="rtl">۳</text><text x="179" y="210" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#f0f2f8" direction="rtl">ابطال</text><text x="179" y="240" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">کجا می‌فهمم اشتباه بوده؟</text><rect x="64" y="260" width="230" height="42" rx="10" fill="#12141b" stroke="#252836" stroke-width="1"/><text x="179" y="287" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="500" fill="#f87171" direction="rtl">زیر ۷۴٬۰۰۰ دلار</text><rect x="355" y="110" width="290" height="216" rx="16" fill="#181b24" stroke="#252836" stroke-width="1"/><circle cx="500" cy="156" r="21" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="500" y="163" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#fbbf24" direction="rtl">۲</text><text x="500" y="210" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#f0f2f8" direction="rtl">تایم‌فریم</text><text x="500" y="240" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">کدام کلوز ملاک است؟</text><rect x="385" y="260" width="230" height="42" rx="10" fill="#12141b" stroke="#252836" stroke-width="1"/><text x="500" y="287" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="500" fill="#fbbf24" direction="rtl">کلوز روزانه</text><rect x="676" y="110" width="290" height="216" rx="16" fill="#181b24" stroke="#252836" stroke-width="1"/><circle cx="821" cy="156" r="21" fill="none" stroke="#7b8eff" stroke-width="2"/><text x="821" y="163" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#7b8eff" direction="rtl">۱</text><text x="821" y="210" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#f0f2f8" direction="rtl">تریگر</text><text x="821" y="240" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#8891a8" direction="rtl">کدام عدد مشخص؟</text><rect x="706" y="260" width="230" height="42" rx="10" fill="#12141b" stroke="#252836" stroke-width="1"/><text x="821" y="287" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="500" fill="#7b8eff" direction="rtl">عبور از ۸۰٬۰۰۰ دلار</text><rect x="34" y="356" width="932" height="76" rx="14" fill="none" stroke="#252836" stroke-width="1" stroke-dasharray="6 6"/><text x="500" y="386" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#f0f2f8" direction="rtl">ادعایی که فقط جزء اول را دارد، یک عدد است؛ ادعایی که جزء سوم را ندارد، هیچ‌وقت غلط از آب درنمی‌آید</text><text x="500" y="412" text-anchor="middle" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">و چیزی که هیچ‌وقت غلط نمی‌شود، هیچ‌وقت هم درست نبوده</text></svg>