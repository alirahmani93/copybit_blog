<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img"><rect width="1200" height="440" fill="#12141b"/><text x="1160" y="54" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#f0f2f8" direction="rtl">بازار پیش‌بینی، عرضهٔ عمومی جمینای ۴ را چه زمانی می‌بیند؟</text><text x="1160" y="86" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#8891a8" direction="rtl">احتمال قیمت‌گذاری‌شده در پلی‌مارکت برای عرضهٔ عمومی تا هر تاریخ، ۵ اکتبر ۲۰۲۶ (حجم حدود یک میلیون دلار)</text><rect x="160" y="132" width="800" height="42" rx="8" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="696" y="132" width="264" height="42" rx="8" fill="#8891a8" opacity="0.9"/><text x="1160" y="160" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#f0f2f8" direction="rtl">تا ۱۰ اکتبر</text><text x="682" y="160" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#8891a8" direction="rtl">۳۳ درصد</text><rect x="160" y="196" width="800" height="42" rx="8" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="384" y="196" width="576" height="42" rx="8" fill="#fbbf24" opacity="0.9"/><text x="1160" y="224" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#f0f2f8" direction="rtl">تا ۱۵ اکتبر</text><text x="370" y="224" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fbbf24" direction="rtl">۷۲ درصد</text><rect x="160" y="260" width="800" height="42" rx="8" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="244" y="260" width="716" height="42" rx="8" fill="#34d399" opacity="0.9"/><text x="1160" y="288" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#f0f2f8" direction="rtl">تا ۳۱ اکتبر</text><text x="230" y="288" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#34d399" direction="rtl">۸۹٫۵ درصد</text><rect x="160" y="324" width="800" height="42" rx="8" fill="#181b24" opacity="1" stroke="#252836" stroke-width="1"/><rect x="186.39999999999998" y="324" width="773.6" height="42" rx="8" fill="#34d399" opacity="0.9"/><text x="1160" y="352" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#f0f2f8" direction="rtl">تا ۳۰ نوامبر</text><text x="172.39999999999998" y="352" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#34d399" direction="rtl">۹۶٫۷ درصد</text><text x="1160" y="408" text-anchor="start" font-family="Vazirmatn,Tahoma,'Noto Sans Arabic','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#fbbf24" direction="rtl">شرط بازار: در دسترس بودن نسخهٔ Flash برای عموم؛ دسترسی محدود یا آزمایشی حساب نمی‌شود. اگر احتمال ۳۱ اکتبر زیر ۵۰ درصد برود، ستاپ لغو می‌شود.</text></svg>